services:
  # Observability: Grafana LGTM
  # L
  loki:
    container_name: loki
    networks:
      - lgtm-net
    # https://github.com/grafana/loki/releases
    image: grafana/loki:latest
    # Override the default config with a custom one
    command: [ '-config.file=/etc/loki/local-config.yaml' ]
    volumes:
      - ./lgtm/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki:/loki
    ports:
      - "3100:3100"
  # G
  grafana:
    depends_on:
      - prometheus
      - loki
      - tempo
    container_name: grafana
    networks:
      - lgtm-net
    image: grafana/grafana:latest # https://hub.docker.com/r/grafana/grafana/tags
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./lgtm/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./lgtm/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./lgtm/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
  # T
  tempo:
    container_name: tempo
    depends_on:
      - prometheus
    networks:
      - lgtm-net
    # https://github.com/grafana/tempo/releases
    image: grafana/tempo:latest
    command: [ '-config.file=/etc/tempo/tempo.yml' ]
    volumes:
      - ./lgtm/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo:/var/tempo
    ports:
      - "3200:3200" # tempo queries (For grafana build the dashboards)
      # not needed since all applications are in the same network bridge
      # - "4318:4318"    # otlp http
      # - "4317:4317"    # otlp grpc
  # M (well here we use Prometheus itself instead of Mimir)
  prometheus:
    container_name: prometheus
    networks:
      - lgtm-net
    # https://hub.docker.com/r/prom/prometheus
    image: prom/prometheus:latest
    command:
      - --enable-feature=exemplar-storage
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./lgtm/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    ports:
      - "9090:9090"
  # Grafana Alloy - The collector
  alloy:
    container_name: alloy
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - lgtm-net
    image: grafana/alloy:latest
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345" # Alloy Debug UI
      - "4318:4318" # OTLP HTTP receiver
      - "4317:4317" # OTLP grpc receiver
    volumes:
      - ./lgtm/alloy/config.alloy:/etc/alloy/config.alloy:ro
networks:
  lgtm-net:
    driver: bridge
volumes:
  loki:
    driver: local
  prometheus:
    driver: local
  tempo:
    driver: local
